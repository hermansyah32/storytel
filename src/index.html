<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="manifest" href="/app.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/images/logo-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Storytel</title>

  <script type="module" src="/scripts/index.js"></script>
</head>

<body>
  <a href="#main-content" class="skip-link" tabindex="0">Lompat ke Konten Utama</a>

  <header>
    <div class="main-header container">
      <a class="brand-name" href="/#/" tabindex="0" aria-label="Storytel Beranda">Storytel</a>

      <nav id="navigation-drawer" class="navigation-drawer" aria-label="Navigasi Utama">
        <div class="navigation-drawer-header">
          <span class="brand-name">Storytel</span>
        </div>
        <ul id="nav-list" class="nav-list">
          <li id="nav-install-item" class="nav-install-item hidden">
            <a href="javascript:void(0)" id="install-pwa-button" class="nav-link" tabindex="0"
              aria-label="Install Aplikasi Storytel">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-download-icon lucide-download">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" x2="12" y1="15" y2="3" />
              </svg>
              <span>Install App</span>
            </a>
          </li>
          <li class="nav-subscribe-item">
            <a href="javascript:void(0)" id="subscribe-menu" class="subscribe-button nav-link" tabindex="0">
              <svg class="unsubscribe-ring-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell">
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path
                  d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
              </svg>
              <svg class="subscribe-ring-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-bell-ring-icon lucide-bell-ring">
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path d="M22 8c0-2.3-.8-4.3-2-6" />
                <path
                  d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
                <path d="M4 2C2.8 3.7 2 5.7 2 8" />
              </svg>
              <span>Subscribe</span>
            </a>
          </li>
          <li>
            <a href="#/about" class="nav-link" tabindex="0">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-info-icon lucide-info">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
              <span>About</span>
            </a>
          </li>
          <li class="nav-separator" aria-hidden="true"></li>
          <li class="nav-logout-item">
            <a href="javascript:void(0)" id="logout-button" class="nav-link" tabindex="0">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-log-out-icon lucide-log-out">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" x2="9" y1="12" y2="12" />
              </svg>
              <span>Logout</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="navbar-action-buttons">
        <button id="subscribe-button" class="subscribe-button" aria-label="Berlangganan Notifikasi" tabindex="0">
          <svg class="unsubscribe-ring-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell">
            <path d="M10.268 21a2 2 0 0 0 3.464 0" />
            <path
              d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
          </svg>
          <svg class="subscribe-ring-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-bell-ring-icon lucide-bell-ring">
            <path d="M10.268 21a2 2 0 0 0 3.464 0" />
            <path d="M22 8c0-2.3-.8-4.3-2-6" />
            <path
              d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
            <path d="M4 2C2.8 3.7 2 5.7 2 8" />
          </svg>
          <span class="sr-only">Subscribe</span>
        </button>
        <button id="drawer-button" class="drawer-button" aria-label="Buka menu navigasi" tabindex="0">☰</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-content" tabindex="-1"></main>
  <div id="backdrop" class="backdrop"></div>
  <div id="dialog-backdrop" class="backdrop"></div>
  <div id="offline-snackbar" class="offline-snackbar hidden" role="status" aria-live="polite">
    <div class="offline-snackbar-content container">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-wifi-off">
        <line x1="2" x2="22" y1="2" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82" />
        <line x1="12" x2="12.01" y1="20" y2="20" />
      </svg>
      <span>Anda sedang berada dalam mode offline (Tanpa Koneksi Internet).</span>
    </div>
  </div>
  <div id="pwa-install-banner" class="pwa-install-banner hidden" role="dialog" aria-labelledby="pwa-banner-title"
    aria-describedby="pwa-banner-desc">
    <div class="pwa-banner-content">
      <img src="/images/logo-192.png" alt="Logo Storytel" class="pwa-banner-icon" />
      <div class="pwa-banner-text">
        <h3 id="pwa-banner-title" class="pwa-banner-title">Install Aplikasi Storytel</h3>
        <p id="pwa-banner-desc" class="pwa-banner-desc">Pasang aplikasi di perangkat Anda untuk akses lebih cepat & mode
          offline.</p>
      </div>
    </div>
    <div class="pwa-banner-actions">
      <button type="button" id="btn-pwa-dismiss" class="btn btn-secondary btn-sm"
        aria-label="Tutup penawaran instalasi">Nanti</button>
      <button type="button" id="btn-pwa-install" class="btn btn-primary btn-sm"
        aria-label="Install aplikasi Storytel sekarang">Install</button>
    </div>
  </div>
</body>

</html>
